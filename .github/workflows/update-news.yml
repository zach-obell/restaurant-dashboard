name: Update news

on:
  schedule:
    # Every 2 hours from 7 AM to 9 PM Eastern (winter time) on weekdays, and twice a day on weekends
    - cron: "0 12-23/2,0,2 * * 1-5"
    - cron: "0 14,22 * * 0,6"
  workflow_dispatch: # lets you run it any time from the Actions tab

permissions:
  contents: write

concurrency:
  group: data-commits # shared with the comps workflow so the two never push at the same moment
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch headlines
        run: python data/update_news.py

      - name: Save changes
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add data/news.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update news"
            git pull --rebase
            git push
          fi
